<div class="flex flex-col bg-white rounded-xl shadow-sm border border-gray-200 h-[40vh]">
  <div
    class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-xl"
  >
    <span class="text-sm font-semibold text-gray-700 uppercase tracking-wider"
      >Input HL7 Message</span
    >
    <button class="text-xs text-indigo-600 hover:underline" (click)="addSampleMsgToForm()">Paste Sample</button>
  </div>
  <textarea
    class="flex-1 p-4 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm text-gray-800"
    placeholder="Paste your HL7 raw data here..."
    matInput
    [formControl]="phiInputFormControl"
    placeholder="Paste the HL7 Message Here"
  ></textarea>
  <div class="p-4 bg-gray-50 border-t border-gray-100 flex gap-3 justify-center">

    <button
      [disabled]="!(phiInputFormControl.valid && phiInputFormControl.value?.slice(0, 3) == 'MSH')"
      (click)="maskPhi()"
      class="flex items-center gap-2 px-4 py-2 bg-[#1b998b] text-white rounded-md transition-all font-medium border border-gray-300 cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-mask"
        viewBox="0 0 16 16"
      >
        <path
          d="M6.225 1.227A7.5 7.5 0 0 1 10.5 8a7.5 7.5 0 0 1-4.275 6.773 7 7 0 1 0 0-13.546M4.187.966a8 8 0 1 1 7.627 14.069A8 8 0 0 1 4.186.964z"
        />
      </svg>
      Mask Message
    </button>

    <button
      (click)="phiInputFormControl.reset(); showResults = false; maskedPhiValue = ''"
      class="flex items-center gap-2 px-4 py-2 bg-[#534D56] text-white rounded-md transition-all font-medium border border-gray-300 cursor-pointer"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-x"
        viewBox="0 0 16 16"
      >
        <path
          d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
        />
      </svg>
      Reset
    </button>
  </div>
</div>

<div
  class="flex flex-col bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mt-10 h-[40vh]"
>
  <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
    <span class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Masked Result</span>
    <button
      class="flex items-center gap-1 text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300 transition-colors cursor-pointer"
      (click)="copyToClipboard()"
    >
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
        ></path>
      </svg>
      Copy Result
    </button>
  </div>
  <div class="flex-1 bg-gray-900 p-4 overflow-auto">
    <pre class="text-sm text-green-400 font-mono">{{ maskedPhiValue }}</pre>
  </div>
</div>
